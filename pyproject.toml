[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "bengali-romanizer"
dynamic = ["version"]
description = "Verified learner-facing romanization of Bengali text"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Apakabarlabs" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
keywords = ["bengali", "romanization", "transliteration", "text-processing"]

[project.urls]
Homepage = "https://github.com/apakabarlabs/bengali-romanizer"
Documentation = "https://apakabarlabs.github.io/bengali-romanizer/bengali_romanizer.html"
Repository = "https://github.com/apakabarlabs/bengali-romanizer"
Issues = "https://github.com/apakabarlabs/bengali-romanizer/issues"
Changelog = "https://github.com/apakabarlabs/bengali-romanizer/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "pyyaml>=6.0",
    "types-PyYAML>=6.0",
    "pdoc>=16.0",
    "build>=1.0",
    "twine>=6.0",
]

[tool.setuptools.dynamic]
version = { attr = "bengali_romanizer.__version__" }

[tool.setuptools.package-data]
bengali_romanizer = ["data/*.gz", "data/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = ["--strict-markers", "--strict-config"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["bengali_romanizer", "tests"]

[tool.coverage.run]
source = ["bengali_romanizer"]
branch = true

[tool.coverage.report]
fail_under = 95
show_missing = true
